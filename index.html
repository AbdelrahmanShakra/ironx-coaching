<style>
/* =========================================================
   IRONX PREMIUM LIQUID GLASS
   ========================================================= */

:root {
  --bg: #050608;
  --bg-soft: #090b0f;
  --surface: rgba(255,255,255,.055);
  --surface-strong: rgba(255,255,255,.085);
  --surface-hover: rgba(255,255,255,.11);

  --border: rgba(255,255,255,.12);
  --border-soft: rgba(255,255,255,.07);

  --text: #f5f7fa;
  --muted: #9299a5;
  --dim: #666d78;

  --accent: #ffffff;
  --accent-soft: rgba(255,255,255,.15);

  --green: #7dffb2;
  --red: #ff6f7d;

  --radius-xl: 32px;
  --radius-lg: 24px;
  --radius-md: 18px;

  --blur: blur(28px) saturate(170%);
  --blur-heavy: blur(42px) saturate(190%);

  --shadow:
    0 30px 80px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.08);

  --transition:
    cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(255,255,255,.055),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 15%,
      rgba(130,150,255,.035),
      transparent 28%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(255,255,255,.025),
      transparent 35%
    ),
    #050608;

  color: var(--text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  overflow-x: hidden;

  -webkit-font-smoothing: antialiased;
}


/* subtle premium grain */

body::before {
  content: "";

  position: fixed;
  inset: 0;

  pointer-events: none;

  opacity: .035;

  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");

  z-index: 9999;
}


/* =========================================================
   GLOBAL GLASS
   ========================================================= */

.glass {
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );

  border: 1px solid var(--border);

  box-shadow: var(--shadow);

  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
}


/* =========================================================
   LOGO
   ========================================================= */

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: -1.8px;

  color: #fff;

  text-shadow:
    0 0 25px rgba(255,255,255,.12);
}

.logo span {
  color: #fff;

  opacity: .45;
}


/* =========================================================
   AUTH SCREEN
   ========================================================= */

#authScreen {
  min-height: 100vh;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 28px;

  position: relative;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(255,255,255,.055),
      transparent 35%
    );
}


/* top */

.auth-top {
  position: absolute;

  top: 30px;
  left: 30px;
  right: 30px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}


/* language */

.language {
  display: flex;
  align-items: center;
  gap: 4px;

  padding: 5px;

  border-radius: 999px;

  background: rgba(255,255,255,.055);

  border: 1px solid rgba(255,255,255,.10);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.language button {
  border: 0;

  color: var(--muted);

  background: transparent;

  padding: 8px 13px;

  border-radius: 999px;

  cursor: pointer;

  font-size: 12px;
  font-weight: 700;

  transition:
    .35s var(--transition);
}

.language button:hover {
  color: #fff;
}

.language button.active {
  color: #000;

  background: #fff;

  box-shadow:
    0 5px 20px rgba(255,255,255,.12);
}


/* =========================================================
   AUTH CARD
   ========================================================= */

.auth-card {
  width: min(440px, 100%);

  padding: 42px;

  border-radius: 34px;

  position: relative;

  overflow: hidden;

  animation:
    authEnter .8s var(--transition);
}


/* glass shine */

.auth-card::before {
  content: "";

  position: absolute;

  top: 0;
  left: 12%;
  right: 12%;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.55),
      transparent
    );

  opacity: .7;
}


.auth-card::after {
  content: "";

  position: absolute;

  width: 220px;
  height: 220px;

  top: -140px;
  right: -100px;

  background: rgba(255,255,255,.045);

  border-radius: 50%;

  filter: blur(50px);

  pointer-events: none;
}


@keyframes authEnter {
  from {
    opacity: 0;
    transform:
      translateY(20px)
      scale(.97);
  }

  to {
    opacity: 1;
    transform:
      translateY(0)
      scale(1);
  }
}


.auth-mode-label {
  font-size: 10px;

  letter-spacing: 2px;

  color: #777f8b;

  font-weight: 800;

  margin-bottom: 13px;
}


.auth-title {
  font-size: clamp(32px, 6vw, 44px);

  line-height: .98;

  letter-spacing: -2px;

  font-weight: 850;

  margin-bottom: 12px;
}


.auth-subtitle {
  color: var(--muted);

  font-size: 14px;

  line-height: 1.7;

  margin-bottom: 32px;
}


/* =========================================================
   FORM
   ========================================================= */

.field {
  margin-bottom: 17px;
}

.field label {
  display: block;

  margin-bottom: 8px;

  font-size: 11px;

  color: #aab0ba;

  font-weight: 700;

  letter-spacing: .3px;
}


.field input {
  width: 100%;

  height: 56px;

  padding: 0 17px;

  border-radius: 17px;

  border: 1px solid rgba(255,255,255,.09);

  outline: none;

  background:
    rgba(255,255,255,.045);

  color: #fff;

  font-size: 14px;

  transition:
    .3s var(--transition);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025);
}


.field input::placeholder {
  color: #555d68;
}


.field input:hover {
  background:
    rgba(255,255,255,.06);
}


.field input:focus {
  border-color:
    rgba(255,255,255,.28);

  background:
    rgba(255,255,255,.07);

  box-shadow:
    0 0 0 4px rgba(255,255,255,.035),
    inset 0 1px 0 rgba(255,255,255,.06);
}


/* =========================================================
   BUTTONS
   ========================================================= */

.primary {
  width: 100%;

  height: 56px;

  border: 0;

  border-radius: 17px;

  background: #fff;

  color: #050505;

  font-size: 13px;

  font-weight: 850;

  cursor: pointer;

  margin-top: 7px;

  transition:
    transform .3s var(--transition),
    box-shadow .3s var(--transition);

  box-shadow:
    0 15px 35px rgba(255,255,255,.08);
}


.primary:hover {
  transform: translateY(-2px);

  box-shadow:
    0 20px 45px rgba(255,255,255,.13);
}


.primary:active {
  transform:
    translateY(0)
    scale(.98);
}


.auth-switch {
  margin-top: 24px;

  text-align: center;

  color: #707782;

  font-size: 12px;
}


.auth-switch button {
  border: 0;

  background: transparent;

  color: #fff;

  font-weight: 750;

  cursor: pointer;

  margin-left: 5px;
}


.error {
  min-height: 18px;

  margin-top: 12px;

  color: var(--red);

  font-size: 12px;

  line-height: 1.5;
}


/* =========================================================
   APP
   ========================================================= */

#app {
  min-height: 100vh;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {
  position: fixed;

  left: 22px;
  top: 22px;
  bottom: 22px;

  width: 245px;

  border-radius: 30px;

  padding: 25px 15px;

  z-index: 100;

  display: flex;
  flex-direction: column;

  background:
    linear-gradient(
      160deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );

  backdrop-filter: var(--blur-heavy);
  -webkit-backdrop-filter: var(--blur-heavy);

  box-shadow:
    0 35px 100px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.08);
}


.sidebar-logo {
  padding:
    7px 13px 30px;
}


.sidebar-nav {
  display: flex;

  flex-direction: column;

  gap: 6px;
}


.nav-button {
  position: relative;

  display: flex;
  align-items: center;

  gap: 13px;

  width: 100%;

  height: 52px;

  padding: 0 15px;

  border: 0;

  border-radius: 16px;

  background: transparent;

  color: #777f8a;

  cursor: pointer;

  font-size: 13px;

  font-weight: 700;

  text-align: left;

  transition:
    .35s var(--transition);
}


.nav-button:hover {
  color: #fff;

  background:
    rgba(255,255,255,.045);
}


.nav-button.active {
  color: #fff;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.12),
      rgba(255,255,255,.045)
    );

  border:
    1px solid rgba(255,255,255,.08);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06);
}


.nav-button.active::before {
  content: "";

  position: absolute;

  left: -1px;

  width: 3px;
  height: 22px;

  border-radius: 0 10px 10px 0;

  background: #fff;

  box-shadow:
    0 0 18px rgba(255,255,255,.45);
}


.nav-icon {
  width: 22px;

  text-align: center;

  font-size: 16px;

  opacity: .8;
}


.sidebar-bottom {
  margin-top: auto;
}


.logout {
  width: 100%;

  height: 48px;

  border-radius: 15px;

  border: 1px solid rgba(255,255,255,.06);

  background:
    rgba(255,255,255,.025);

  color: #777f8a;

  cursor: pointer;

  font-size: 12px;

  font-weight: 700;

  transition:
    .3s var(--transition);
}


.logout:hover {
  color: #fff;

  background:
    rgba(255,255,255,.06);
}


/* =========================================================
   MAIN
   ========================================================= */

.main {
  margin-left: 290px;

  padding:
    35px 38px 80px;

  max-width: 1700px;
}


/* =========================================================
   TOPBAR
   ========================================================= */

.topbar {
  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 32px;
}


.welcome-small {
  color: #656c77;

  font-size: 10px;

  letter-spacing: 2px;

  font-weight: 800;

  margin-bottom: 7px;
}


.welcome-title {
  font-size: clamp(28px, 4vw, 44px);

  letter-spacing: -2px;

  font-weight: 850;
}


.profile {
  display: flex;

  align-items: center;

  gap: 10px;

  padding:
    6px 13px 6px 6px;

  border-radius: 999px;

  border:
    1px solid rgba(255,255,255,.09);

  background:
    rgba(255,255,255,.045);

  backdrop-filter: blur(25px);
}


.avatar {
  width: 38px;
  height: 38px;

  border-radius: 50%;

  display: grid;
  place-items: center;

  background:
    linear-gradient(
      145deg,
      #fff,
      #aaa
    );

  color: #000;

  font-size: 13px;

  font-weight: 900;
}


.profile-name {
  font-size: 12px;

  font-weight: 700;
}


/* =========================================================
   HERO
   ========================================================= */

.hero {
  min-height: 470px;

  border-radius: 34px;

  overflow: hidden;

  position: relative;

  display: flex;
  align-items: flex-end;

  padding: 52px;

  background:
    radial-gradient(
      circle at 75% 25%,
      rgba(255,255,255,.09),
      transparent 25%
    ),
    linear-gradient(
      135deg,
      rgba(255,255,255,.085),
      rgba(255,255,255,.025)
    );

  border:
    1px solid rgba(255,255,255,.11);

  backdrop-filter:
    blur(35px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(35px)
    saturate(170%);

  box-shadow:
    0 40px 110px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.09);
}


.hero::before {
  content: "";

  position: absolute;

  width: 480px;
  height: 480px;

  right: -140px;
  top: -170px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.12),
      transparent 65%
    );

  filter: blur(10px);

  pointer-events: none;
}


.hero::after {
  content: "IRONX";

  position: absolute;

  right: 4%;
  bottom: -45px;

  font-size: clamp(100px, 17vw, 260px);

  font-weight: 950;

  letter-spacing: -14px;

  color: rgba(255,255,255,.025);

  pointer-events: none;
}


.hero-content {
  position: relative;

  z-index: 2;

  max-width: 650px;
}


.hero-kicker {
  font-size: 10px;

  letter-spacing: 2.5px;

  color: #858d98;

  font-weight: 850;

  margin-bottom: 18px;
}


.hero-title {
  font-size: clamp(55px, 8vw, 105px);

  line-height: .84;

  letter-spacing: -6px;

  font-weight: 950;

  margin-bottom: 28px;
}


.hero-title span {
  color: transparent;

  -webkit-text-stroke:
    1px rgba(255,255,255,.55);
}


.hero-description {
  max-width: 510px;

  color: #949ba5;

  line-height: 1.7;

  font-size: 13px;

  margin-bottom: 28px;
}


.hero-actions {
  display: flex;

  gap: 10px;

  flex-wrap: wrap;
}


.hero-button,
.secondary-button {
  height: 48px;

  padding: 0 20px;

  border-radius: 14px;

  cursor: pointer;

  font-size: 12px;

  font-weight: 800;

  transition:
    .3s var(--transition);
}


.hero-button {
  border: 0;

  color: #000;

  background: #fff;

  box-shadow:
    0 15px 35px rgba(255,255,255,.08);
}


.hero-button:hover {
  transform: translateY(-2px);
}


.secondary-button {
  border:
    1px solid rgba(255,255,255,.1);

  color: #fff;

  background:
    rgba(255,255,255,.04);

  backdrop-filter: blur(20px);
}


.secondary-button:hover {
  background:
    rgba(255,255,255,.08);
}


/* =========================================================
   STATS
   ========================================================= */

.stats {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 12px;

  margin-top: 14px;
}


.stat {
  padding: 25px;

  border-radius: 23px;

  transition:
    .35s var(--transition);
}


.stat:hover {
  transform: translateY(-4px);

  background:
    rgba(255,255,255,.075);
}


.stat-number {
  font-size: 30px;

  font-weight: 850;

  letter-spacing: -1px;

  margin-bottom: 6px;
}


.stat-label {
  color: #727985;

  font-size: 10px;

  font-weight: 700;
}


/* =========================================================
   SECTIONS
   ========================================================= */

.section {
  margin-top: 65px;
}


.section-head {
  display: flex;

  justify-content: space-between;

  margin-bottom: 20px;
}


.section-head h2 {
  font-size: 25px;

  letter-spacing: -1px;

  margin-bottom: 5px;
}


.section-head p {
  color: #737a85;

  font-size: 12px;
}


/* =========================================================
   FEATURE CARDS
   ========================================================= */

.feature-grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 13px;
}


.feature {
  min-height: 210px;

  padding: 28px;

  border-radius: 25px;

  transition:
    .4s var(--transition);
}


.feature:hover {
  transform:
    translateY(-6px)
    scale(1.01);

  background:
    rgba(255,255,255,.075);
}


.feature-number {
  color: #555d68;

  font-size: 10px;

  letter-spacing: 1px;

  margin-bottom: 55px;
}


.feature h3 {
  font-size: 20px;

  margin-bottom: 8px;
}


.feature p {
  color: #777f89;

  font-size: 12px;

  line-height: 1.6;
}


/* =========================================================
   PLAN
   ========================================================= */

.plan-grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 14px;
}


.plan-card {
  padding: 28px;

  border-radius: 25px;

  transition:
    .4s var(--transition);
}


.plan-card:hover {
  transform: translateY(-5px);
}


.plan-day {
  color: #666e79;

  font-size: 10px;

  letter-spacing: 1.5px;

  font-weight: 800;

  margin-bottom: 15px;
}


.plan-card h3 {
  font-size: 24px;

  margin-bottom: 25px;
}


.exercise-list {
  list-style: none;
}


.exercise-list li {
  display: flex;

  justify-content: space-between;

  padding: 13px 0;

  border-bottom:
    1px solid rgba(255,255,255,.055);

  font-size: 12px;

  color: #a6adb7;
}


.exercise-list li span:last-child {
  color: #fff;

  font-weight: 750;
}


/* =========================================================
   PROGRESS
   ========================================================= */

.progress-layout {
  display: grid;

  grid-template-columns:
    1fr 1.3fr;

  gap: 14px;
}


.progress-card {
  padding: 35px;

  border-radius: 28px;
}


.big-progress {
  font-size: 75px;

  line-height: 1;

  font-weight: 900;

  letter-spacing: -5px;

  margin-bottom: 12px;
}


.progress-bar {
  height: 6px;

  margin-top: 20px;

  background:
    rgba(255,255,255,.06);

  border-radius: 99px;

  overflow: hidden;
}


.progress-fill {
  width: 68%;

  height: 100%;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      #fff,
      #888
    );

  box-shadow:
    0 0 20px rgba(255,255,255,.25);
}


.lift-grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 12px;
}


.lift {
  min-height: 170px;

  padding: 25px;

  border-radius: 24px;

  display: flex;

  flex-direction: column;

  justify-content: space-between;

  transition:
    .35s var(--transition);
}


.lift:hover {
  transform: translateY(-5px);
}


.lift-name {
  color: #858c96;

  font-size: 11px;
}


.lift-value {
  font-size: 27px;

  font-weight: 850;
}


/* =========================================================
   GOALS
   ========================================================= */

.goals {
  display: flex;

  flex-direction: column;

  gap: 12px;
}


.goal {
  min-height: 90px;

  padding: 20px 23px;

  border-radius: 22px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  transition:
    .35s var(--transition);
}


.goal:hover {
  transform: translateX(4px);

  background:
    rgba(255,255,255,.075);
}


.goal-info h3 {
  font-size: 14px;

  margin-bottom: 5px;
}


.goal-info p {
  color: #6f7782;

  font-size: 11px;
}


.goal-check {
  width: 26px;
  height: 26px;

  border-radius: 50%;

  border:
    1px solid rgba(255,255,255,.15);

  display: grid;

  place-items: center;

  color: transparent;
}


.goal-check.done {
  background: #fff;

  color: #000;

  border-color: #fff;

  font-size: 12px;

  font-weight: 900;
}


/* =========================================================
   ACCOUNT
   ========================================================= */

.account-card {
  max-width: 700px;

  border-radius: 27px;

  padding: 10px 25px;
}


.account-row {
  min-height: 72px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  border-bottom:
    1px solid rgba(255,255,255,.055);
}


.account-row:last-child {
  border-bottom: 0;
}


.account-label {
  color: #777f89;

  font-size: 12px;
}


.account-row strong {
  font-size: 13px;
}


/* =========================================================
   PAGE TRANSITIONS
   ========================================================= */

.page {
  animation:
    pageEnter .5s var(--transition);
}


@keyframes pageEnter {

  from {
    opacity: 0;

    transform:
      translateY(12px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);
  }

}


/* =========================================================
   PREMIUM FLOATING MOBILE NAV
   ========================================================= */

.mobile-nav {

  position: fixed;

  left: 50%;

  bottom: 17px;

  transform:
    translateX(-50%);

  width:
    min(94vw, 470px);

  height: 70px;

  padding: 7px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 5px;

  z-index: 999;

  border-radius: 25px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.105),
      rgba(255,255,255,.035)
    );

  border:
    1px solid rgba(255,255,255,.13);

  backdrop-filter:
    blur(35px)
    saturate(180%);

  -webkit-backdrop-filter:
    blur(35px)
    saturate(180%);

  box-shadow:
    0 25px 70px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -1px 0 rgba(0,0,0,.2);
}


/* top glass reflection */

.mobile-nav::before {

  content: "";

  position: absolute;

  top: 0;

  left: 14%;

  right: 14%;
